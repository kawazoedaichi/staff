<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ビースタイル 追客・掘り起こし管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./data.js" onerror="window.BSTYLE_DATA_MISSING=true"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f3f4f6;
      color: #111827;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .tab-active {
      border-bottom: 3px solid #f97316;
      color: #ffffff;
      font-weight: 700;
    }
    .tab-inactive {
      border-bottom: 3px solid transparent;
      color: #9ca3af;
    }
    .tab-inactive:hover { color: #e5e7eb; }
    .modal-backdrop {
      background-color: rgba(17, 24, 39, 0.72);
      backdrop-filter: blur(2px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ヘッダー（ブラック＆オレンジ SaaS UI） -->
  <header class="bg-zinc-950 text-white sticky top-0 z-30 shadow-md border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 pt-3 pb-2 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-orange-500 text-zinc-950 font-black flex items-center justify-center text-lg shadow">B</div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg tracking-tight">ビースタイル 追客・掘り起こし管理</h1>
            <span id="dataSourceBadge" class="text-[11px] px-2 py-0.5 rounded-full bg-zinc-800 text-orange-400 border border-zinc-700 font-medium">読込中...</span>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 text-xs">
        <a href="https://refo.link/haken-oubo/applications" target="_blank" rel="noopener noreferrer"
           class="px-2.5 py-1.5 rounded-md bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border border-zinc-700 font-medium transition flex items-center gap-1">
          <span>Refo応募一覧</span><span class="text-orange-400">↗</span>
        </a>
        <a href="https://kawazoedaichi.github.io/searchOrder/" target="_blank" rel="noopener noreferrer"
           class="px-2.5 py-1.5 rounded-md bg-zinc-900 hover:bg-zinc-800 text-orange-400 border border-orange-500/40 font-bold transition flex items-center gap-1">
          <span>案件詳細</span><span>↗</span>
        </a>
        <button type="button" onclick="openModal('githubModal')"
           class="px-2.5 py-1.5 rounded-md bg-zinc-900 hover:bg-zinc-800 text-emerald-400 border border-emerald-500/40 font-bold transition flex items-center gap-1">
          <span>🚀 GitHub自動反映</span>
        </button>
        <button type="button" onclick="openModal('exportModal')"
           class="px-2.5 py-1.5 rounded-md bg-zinc-800 hover:bg-zinc-700 text-white border border-zinc-600 font-bold transition">
          CSV出力
        </button>
        <button type="button" onclick="openModal('urlModal')"
           class="px-2.5 py-1.5 rounded-md bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-600 font-medium transition">
          URL・案件設定
        </button>
        <button type="button" onclick="openModal('csvModal')"
           class="px-3 py-1.5 rounded-md bg-orange-500 hover:bg-orange-600 text-zinc-950 font-black transition shadow-sm">
          CSV読込
        </button>
      </div>
    </div>

    <!-- 5タブナビゲーション（最左から優先順） -->
    <nav class="max-w-7xl mx-auto px-2 sm:px-6 flex overflow-x-auto scrollbar-hide gap-1 sm:gap-4 text-xs sm:text-sm pt-1">
      <button type="button" onclick="switchTab('within3days')" id="tab-within3days" class="tab-active py-2.5 px-2.5 whitespace-nowrap flex items-center gap-1.5 transition">
        <span>3日以内 未FIX人材</span>
        <span id="badge-within3days" class="px-1.5 py-0.5 text-[11px] rounded-full bg-orange-500 text-zinc-950 font-black">0</span>
      </button>
      <button type="button" onclick="switchTab('future')" id="tab-future" class="tab-inactive py-2.5 px-2.5 whitespace-nowrap flex items-center gap-1.5 transition">
        <span>未来人材</span>
        <span id="badge-future" class="px-1.5 py-0.5 text-[11px] rounded-full bg-zinc-800 text-zinc-300 font-bold">0</span>
      </button>
      <button type="button" onclick="switchTab('unfixed')" id="tab-unfixed" class="tab-inactive py-2.5 px-2.5 whitespace-nowrap flex items-center gap-1.5 transition">
        <span>未FIX人材</span>
        <span id="badge-unfixed" class="px-1.5 py-0.5 text-[11px] rounded-full bg-zinc-800 text-zinc-300 font-bold">0</span>
      </button>
      <button type="button" onclick="switchTab('hot')" id="tab-hot" class="tab-inactive py-2.5 px-2.5 whitespace-nowrap flex items-center gap-1.5 transition">
        <span>激熱掘起</span>
        <span id="badge-hot" class="px-1.5 py-0.5 text-[11px] rounded-full bg-zinc-800 text-zinc-300 font-bold">0</span>
      </button>
      <button type="button" onclick="switchTab('normal')" id="tab-normal" class="tab-inactive py-2.5 px-2.5 whitespace-nowrap flex items-center gap-1.5 transition">
        <span>通常掘起</span>
        <span id="badge-normal" class="px-1.5 py-0.5 text-[11px] rounded-full bg-zinc-800 text-zinc-300 font-bold">0</span>
      </button>
    </nav>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-4 space-y-3">

    <!-- タブ別アプローチ設計アコーディオン -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <button type="button" onclick="toggleGuide()" class="w-full px-4 py-2.5 flex items-center justify-between text-left text-xs sm:text-sm font-bold text-gray-800 hover:bg-gray-50 transition">
        <span id="guideTitle" class="text-orange-600">【3日以内 未FIX人材】の抽出基準・アプローチ設計を見る</span>
        <span id="guideArrow" class="text-gray-400 text-xs">開く ▼</span>
      </button>
      <div id="guideBody" class="hidden px-4 pb-3 pt-1 border-t border-gray-10
